openapi: 3.0.0
info:
  title: General Purpose URL Fetcher API
  description: A GAS Web App to fetch content from any provided URL.
  version: 1.2.0
servers:
  - url: https://script.google.com/macros/s/<deployment-id>
    description: Production server (deployment ID is not published)
paths:
  /exec:
    get:
      summary: Fetch content from a target URL.
      parameters:
        - name: u
          in: query
          description: Target URL (http or https).
          required: true
          schema:
            type: string
            format: uri
            example: "https://example.com"
        - name: token
          in: query
          description: Client token (must match a token stored in the script properties).
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    nullable: true
                  content:
                    type: string
                    nullable: true
                  error:
                    type: string
                    nullable: true
